# Odoo module tests: PostgreSQL + install MODULE + unittest (--test-tags).
name: CI

on:
  push:
    branches: ['18.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-tests:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci_odoo_test
      COMPOSE_PROJECT_NAME: odoo-square-v18-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Odoo 18 Community
        run: docker compose -f docker-compose.test.yml build odoo

      - name: Install and test Square on a fresh database
        run: docker compose -f docker-compose.test.yml run --rm odoo

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
