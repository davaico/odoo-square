# Fresh Odoo 19 Community install and addon tests.
name: CI

on:
  push:
    branches: ["19.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and test Odoo Square
        shell: bash
        run: |
          docker compose -f docker-compose.test.yml run --rm -T odoo 2>&1 \
            | tee "$RUNNER_TEMP/odoo-tests.log"
          # Odoo can exit successfully with zero tests if it skips the addon.
          grep -Eq '0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' \
            "$RUNNER_TEMP/odoo-tests.log"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs db

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
