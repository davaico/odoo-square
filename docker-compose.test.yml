name: odoo-square-v19-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: odoo_square_test
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-ci_odoo_test}
    volumes:
      - odoo_square_test_pg:/var/lib/postgresql/data

  odoo:
    image: ${ODOO_TEST_IMAGE:-odoo:19.0-20260908}
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${TEST_DB_PASSWORD:-ci_odoo_test}
      SQUARE_ONLINE_ENCRYPTION_KEY: ${SQUARE_ONLINE_TEST_ENCRYPTION_KEY:-}
    volumes:
      - odoo_square_test_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo_square:/mnt/extra-addons/odoo_square:ro
      - ./payment_square_online:/mnt/extra-addons/payment_square_online:ro
    command:
      - odoo
      - --database=odoo_square_test
      - --init=odoo_square
      - --test-tags=/odoo_square
      - --workers=0
      - --stop-after-init
      - --log-level=test

volumes:
  odoo_square_test_pg:
  odoo_square_test_data:
