name: odoo-square-v18-test

services:
  db:
    build:
      context: config
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-odoo_square_v18_test}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - odoo_square_test_pg:/var/lib/postgresql/data
    networks:
      - odoo-test-net

  odoo:
    image: ${ODOO_TEST_IMAGE:-odoo-square-v18-test}
    build:
      context: .
      dockerfile: ${ODOO_TEST_DOCKERFILE:-Dockerfile}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOST=${DB_HOST:-db}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - odoo_square_test_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo_square:/mnt/extra-addons/odoo_square:ro
      - ./payment_square_online:/mnt/extra-addons/payment_square_online:ro
    command:
      - odoo
      - --database=${DB_NAME:-odoo_square_v18_test}
      - --init=${ODOO_INIT_MODULES:-odoo_square}
      - --test-tags=${ODOO_TEST_TAGS:-/odoo_square}
      - --workers=0
      - --stop-after-init
      - --log-level=test
    networks:
      - odoo-test-net

networks:
  odoo-test-net:
    driver: bridge

volumes:
  odoo_square_test_pg:
  odoo_square_test_data:
