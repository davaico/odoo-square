name: odoo-square-v19

services:
  db:
    build:
      context: ./config
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-odoo_square_v19}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    build:
      context: ./config
    depends_on:
      - db
    restart: unless-stopped
    environment:
      HOST: ${DB_HOST:-db}
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SQUARE_ONLINE_ENCRYPTION_KEY: ${SQUARE_ONLINE_ENCRYPTION_KEY:-}
      ODOO_SQUARE_TERMINAL_ENCRYPTION_KEY: ${ODOO_SQUARE_TERMINAL_ENCRYPTION_KEY:-}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo_square:/mnt/extra-addons/odoo_square:ro
      - ./payment_square_online:/mnt/extra-addons/payment_square_online:ro
      - ./pos_square_terminal:/mnt/extra-addons/pos_square_terminal:ro
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    command:
      - odoo
      - --database=${DB_NAME:-odoo_square_v19}

volumes:
  odoo_db_data:
  odoo_data:
