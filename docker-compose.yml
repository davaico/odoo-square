name: odoo-square-v18

services:
  db:
    build:
      context: config
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-odoo_square_v18}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - odoo-network

  odoo:
    build: .
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - HOST=${DB_HOST:-db}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - ODOO_SQUARE_ONLINE_ENCRYPTION_KEY=${ODOO_SQUARE_ONLINE_ENCRYPTION_KEY:-}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo_square:/mnt/extra-addons/odoo_square:ro
      - ./payment_square_online:/mnt/extra-addons/payment_square_online:ro
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    command:
      - odoo
      - --database=${DB_NAME:-odoo_square_v18}
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge

volumes:
  odoo_db_data:
  odoo_data:
